<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .big{
            width: 500px;

        }
        #bigimg{
                width:100%;
                
        }
        #img1, #img2{
            width:250px
        }
    </style>
</head>
<body>
    
       <div class="big">
        <img src="sports-shoe1-600x600.jpg" alt="" id="bigimg">
       </div> 

        <img src="sports-shoe2-600x600.jpg" alt="" id="img2" onclick="img2()">
        <img src="sports-shoe3-600x600.jpg" alt="" id="img1" onclick="img3()">

<script>
    function img2(){
        document.getElementById("bigimg").removeAttribute("src");


        document.getElementById("bigimg").setAttribute("src","sports-shoe2-600x600.jpg");
        

    }
    function img3(){
        document.getElementById("bigimg").removeAttribute("src")
        document.getElementById("bigimg").setAttribute("src","sports-shoe3-600x600.jpg")
        

    }
</script>
</body>
</html>
